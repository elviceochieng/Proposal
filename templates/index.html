<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Question ❤️</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Floating background hearts -->
    <div class="floating-hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>💘</span>
        <span>❤️</span>
        <span>💝</span>
        <span>💕</span>
    </div>

    <!-- Main proposal card -->
    <main class="container">

        <div class="top-label">A LITTLE QUESTION FOR YOU</div>

        <div class="main-heart">❤️</div>

        <h1>Hey Kabura🥰️!</h1>
       
        it's me Elvice😊️

        <p class="subtitle">
            I've got something special to ask you...
        </p>

        <div class="divider">
            <span>♥</span>
        </div>

        <h2>Will you be my girlfriend?</h2>

        <p class="description">
            Life may not be perfect, but I'd love to make beautiful
            memories with you. 🥹
        </p>

        <div class="buttons">

            <button class="yes-button" onclick="sendAnswer('Yes')">
                YES! ❤️
            </button>

            <button class="no-button" onclick="sendAnswer('No')">
                NO 💔
            </button>

        </div>

        <div id="response"></div>

        <footer>
            Made with ❤️ just for you
        </footer>

    </main>

    <script src="/static/script.js"></script>

</body>
</html>
